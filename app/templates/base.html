<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}防汛雨量数据平台{% endblock %}</title>
<style>
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f4f6f8;color:#222}
  header{background:#0b5cad;color:#fff;padding:12px 24px}
  header a{color:#fff;text-decoration:none;font-size:18px;font-weight:600}
  main{max-width:1100px;margin:24px auto;padding:0 16px}
  .card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:16px 20px;margin-bottom:20px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid #dde3ea;padding:6px 10px;text-align:left}
  th{background:#eef2f6}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap}
  .ok{background:#e2f5e9;color:#157347}
  .bad{background:#fde8e8;color:#b02a37}
  .warn{background:#fff4d6;color:#8a6d00}
  tr.missing{background:#fde8e8}
  .flash{padding:10px 14px;border-radius:6px;margin-bottom:16px}
  .flash.error{background:#fde8e8;color:#b02a37}
  .flash.info{background:#e7f1fd;color:#0b5cad}
  code{background:#eef2f6;padding:1px 5px;border-radius:4px}
  .muted{color:#667}
  input,textarea,button{font:inherit}
  button{background:#0b5cad;color:#fff;border:0;border-radius:6px;padding:8px 18px;cursor:pointer}
  h2{margin-top:0}
</style>
</head>
<body>
<header><a href="{{ url_for('index') }}">防汛雨量数据平台</a></header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
